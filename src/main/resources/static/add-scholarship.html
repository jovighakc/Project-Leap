<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Scholarship - ScholarTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">🎓 ScholarTrack</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="schemes.html">Scholarships</a>
          <a href="verification-admin.html">Verification</a>
          <a href="add-scholarship.html" class="active">Add Scholarship</a>
          <button class="nav-logout" id="logoutButton" type="button">Logout</button>
        </nav>
      </div>
    </header>

    <main class="page-content admin-form-page">
      <div class="admin-form-shell">
        <h1>Add Scholarship</h1>
        <p class="section-description">Create a new scholarship scheme for new student applications.</p>

        <form id="scholarshipForm" class="scholarship-form">
          <div class="form-row two-col">
            <div class="form-group">
              <label for="schemeName">SCHOLARSHIP NAME</label>
              <div class="input-with-icon">
                <span class="input-icon">✎</span>
                <input type="text" id="schemeName" placeholder="Enter scholarship name" required />
              </div>
            </div>

            <div class="form-group">
              <label for="scholarshipAmount">SCHOLARSHIP AMOUNT (₹)</label>
              <input type="number" id="scholarshipAmount" min="0" step="0.01" placeholder="Enter amount" required />
            </div>
          </div>

          <div class="form-row two-col">
            <div class="form-group">
              <label for="incomeLimit">INCOME LIMIT (₹)</label>
              <input type="number" id="incomeLimit" min="0" step="0.01" placeholder="Enter income limit" required />
            </div>

            <div class="form-group">
              <label for="minimumMarks">MINIMUM MARKS</label>
              <input type="number" id="minimumMarks" min="0" max="100" step="0.01" placeholder="Enter minimum marks" required />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="description">DESCRIPTION</label>
            <textarea id="description" rows="5" placeholder="Enter scholarship description"></textarea>
          </div>

          <button type="submit" class="primary-action-btn large-btn">➕ Add Scholarship</button>
        </form>

        <div id="schemeMessage" class="verification-message"></div>
      </div>
    </main>

    <script src="script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        requireAdminAuth();
        attachLogout();

        const form = document.getElementById('scholarshipForm');
        const schemeMessage = document.getElementById('schemeMessage');

        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const payload = {
            schemeName: document.getElementById('schemeName').value.trim(),
            description: document.getElementById('description').value.trim(),
            incomeLimit: Number(document.getElementById('incomeLimit').value),
            minimumMarks: Number(document.getElementById('minimumMarks').value),
            scholarshipAmount: Number(document.getElementById('scholarshipAmount').value)
          };

          if (!payload.schemeName || !payload.description || Number.isNaN(payload.incomeLimit) || Number.isNaN(payload.minimumMarks) || Number.isNaN(payload.scholarshipAmount)) {
            showMessage(schemeMessage, 'Please fill all scholarship fields correctly.', 'error');
            return;
          }

          try {
            const response = await fetch('/schemes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            let result = {};
            try {
              result = await response.json();
            } catch (error) {
              result = {};
            }

            if (!response.ok) {
              throw new Error(result.message || 'Scholarship could not be added.');
            }

            form.reset();
            showMessage(schemeMessage, 'Scholarship added successfully.', 'success');
          } catch (error) {
            showMessage(schemeMessage, error.message || 'Scholarship could not be added.', 'error');
          }
        });
      });
    </script>
  </body>
</html>
