<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Status | ScholarTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">🎓 ScholarTrack</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="schemes.html">Scholarships</a>
          <a href="student-dashboard.html">Dashboard</a>
          <a href="status.html" class="active">My Status</a>
          <button class="nav-logout" id="logoutButton" type="button">Logout</button>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <div class="container">
        <section class="page-header">
          <span class="eyebrow dark">Application tracking</span>
          <h1>Application Status</h1>
          <p>Track your scholarship application, verification and disbursement status.</p>
        </section>

        <div id="statusLoading" class="status-box info">Loading your application status...</div>
        <div id="statusError" class="status-box hidden error"></div>
        <div id="statusContent" class="hidden"></div>
      </div>
    </main>

    <script src="script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        requireAuth();
        const studentId = localStorage.getItem('studentId');
        const loading = document.getElementById('statusLoading');
        const errorBox = document.getElementById('statusError');
        const content = document.getElementById('statusContent');

        try {
          loading.classList.remove('hidden');
          const applicationList = await apiRequest(`/applications/student/${studentId}`);

          if (!Array.isArray(applicationList) || applicationList.length === 0) {
            content.innerHTML = '<div class="empty-state">No applications found yet.</div>';
            content.classList.remove('hidden');
            loading.classList.add('hidden');
            return;
          }

          // Sort applications descending by ID (newest first)
          const sortedApps = [...applicationList].sort((a, b) => Number(b.id) - Number(a.id));

          // Pre-select stored application or newest application
          const savedAppId = localStorage.getItem('applicationId');
          let selectedAppId = savedAppId ? Number(savedAppId) : sortedApps[0].id;
          if (!sortedApps.some(a => Number(a.id) === selectedAppId)) {
            selectedAppId = sortedApps[0].id;
          }

          async function renderApplicationStatus(appId) {
            const app = sortedApps.find(a => Number(a.id) === Number(appId)) || sortedApps[0];
            const verification = await fetchVerificationForApplication(app.id);
            const verificationStatus = String(verification?.status || '').toUpperCase();
            const applicationStatus = String(app.applicationStatus || 'PENDING').toUpperCase();
            
            const isDocumentVerified = verificationStatus === 'APPROVED' || (verificationStatus !== 'REJECTED' && applicationStatus === 'APPROVED');
            const documentVerificationLabel = verificationStatus || 'PENDING';
            const approvalStatus = applicationStatus === 'APPROVED' ? 'APPROVED' : applicationStatus === 'REJECTED' ? 'REJECTED' : 'PENDING';
            const disbursementStatus = String(app.disbursementStatus || 'NOT_STARTED').toUpperCase();
            const submittedStatus = 'SUBMITTED';

            const dropdownHtml = sortedApps.length > 1 ? `
              <div class="form-group" style="margin-bottom: 1.5rem; max-width: 320px;">
                <label for="statusAppSelect"><strong>Select Application:</strong></label>
                <select id="statusAppSelect" class="form-control">
                  ${sortedApps.map(a => `
                    <option value="${a.id}" ${Number(a.id) === Number(app.id) ? 'selected' : ''}>
                      Application #${a.id} - ${escapeHtml(a.scheme ? a.scheme.schemeName : 'Scholarship')}
                    </option>
                  `).join('')}
                </select>
              </div>
            ` : '';

            content.innerHTML = `
              ${dropdownHtml}
              <div class="status-summary">
                <div class="summary-card">
                  <span class="pill">Application ID</span>
                  <h3>#${app.id}</h3>
                  <p><strong>Scholarship:</strong> ${escapeHtml(app.scheme ? app.scheme.schemeName : 'N/A')}</p>
                  <p><strong>Application Date:</strong> ${escapeHtml(app.applicationDate || 'N/A')}</p>
                </div>
              </div>

              <div class="timeline">
                <div class="timeline-item complete">
                  <span class="dot">✓</span>
                  <div>
                    <h4>Application Submitted</h4>
                    <p>${escapeHtml(submittedStatus)}</p>
                  </div>
                </div>

                <div class="timeline-item ${isDocumentVerified ? 'complete' : 'pending'}">
                  <span class="dot">${isDocumentVerified ? '✓' : '•'}</span>
                  <div>
                    <h4>Document Verification</h4>
                    <p>${escapeHtml(documentVerificationLabel)}</p>
                  </div>
                </div>

                <div class="timeline-item ${approvalStatus === 'APPROVED' ? 'complete' : 'pending'}">
                  <span class="dot">${approvalStatus === 'APPROVED' ? '✓' : '•'}</span>
                  <div>
                    <h4>Approval Status</h4>
                    <p>${escapeHtml(approvalStatus)}</p>
                  </div>
                </div>

                <div class="timeline-item ${disbursementStatus === 'COMPLETED' ? 'complete' : 'pending'}">
                  <span class="dot">${disbursementStatus === 'COMPLETED' ? '✓' : '•'}</span>
                  <div>
                    <h4>Disbursement Status</h4>
                    <p>${escapeHtml(disbursementStatus)}</p>
                  </div>
                </div>
              </div>
            `;

            const selectElem = document.getElementById('statusAppSelect');
            if (selectElem) {
              selectElem.addEventListener('change', (e) => {
                const newId = Number(e.target.value);
                localStorage.setItem('applicationId', String(newId));
                renderApplicationStatus(newId);
              });
            }
          }

          await renderApplicationStatus(selectedAppId);
          content.classList.remove('hidden');
          loading.classList.add('hidden');
        } catch (error) {
          loading.classList.add('hidden');
          errorBox.textContent = 'Unable to load application status. Please try again.';
          errorBox.classList.remove('hidden');
        }
      });
    </script>
  </body>
</html>
